name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # No dependencies to install: the tests use only Node's and Python's standard libraries.
      # (validate.py is no longer run here: it checks the out-of-scope v3 backend and
      # writes to the v1 database when its dependencies are installed — AUDIT M13.)
      - name: Tests
        run: npm test
